<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Не плюхнись: слепой монстр</title>
    <link rel="icon" type="image/png" href="assets/branding/lory-engine.png">
    <link rel="stylesheet" href="css/game.css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #222;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        input, textarea, [contenteditable] { -webkit-user-select: text; user-select: text; }
        img { -webkit-user-drag: none; }
        #world3d {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
            touch-action: none;
        }
        /* Don’t Splash: экран загрузки — стена старого бассейна: плитка, вывеска из мозаики, дорожка-прогресс с поплавками */
        #loading-screen {
            position: fixed; inset: 0; z-index: 1000; overflow: hidden;
            display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 12px;
            background: #e9dfc2; font-synthesis: none; font-family: 'BPM Barlow', 'BPM Unbounded Fit', 'Arial Narrow', system-ui, sans-serif; color: #1f3a4f;
        }
        #loading-screen .ld-bg {
            position: absolute; inset: 0; pointer-events: none;
            background:
                radial-gradient(120% 70% at 50% 30%, rgba(250,245,230,.9) 0%, rgba(233,223,194,.4) 55%, rgba(217,205,176,0) 80%),
                linear-gradient(180deg, #ece3c8 0%, #ddd1b0 56%, #2a9d8f 56.2%, #1f857a 78%, #0f5e5a 100%);
        }
        #loading-screen .ld-tiles {
            position: absolute; left: 0; right: 0; top: 0; height: 56%; pointer-events: none; opacity: .75;
            background-image: repeating-linear-gradient(0deg, transparent 0 39px, rgba(185,171,136,.6) 39px 41px), repeating-linear-gradient(90deg, transparent 0 39px, rgba(185,171,136,.6) 39px 41px);
            -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 70%, transparent 100%); mask-image: linear-gradient(180deg, #000 0%, #000 70%, transparent 100%);
        }
        #loading-screen .ld-water { position: absolute; left: 0; right: 0; bottom: 0; height: 44%; overflow: hidden; pointer-events: none; }
        #loading-screen .ld-water::before {
            content: ''; position: absolute; left: -180px; top: -180px; right: 0; bottom: 0;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180' viewBox='0 0 180 180'><g fill='none' stroke='%23f3ead5' stroke-width='3' stroke-linecap='round' opacity='.5'><path d='M10 40c20-26 44-24 58-6s34 14 46-6M96 100c14-20 38-26 56-8 14 14 22 10 30 0M20 140c18-22 38-16 52-2s30 12 42-6M120 30c8 16 22 20 36 12M50 78c10 8 22 8 30 0'/></g></svg>");
            background-size: 180px 180px; animation: ld-drift 18s linear infinite;
        }
        @keyframes ld-drift { from { transform: translate3d(0, 0, 0); } to { transform: translate3d(180px, 180px, 0); } }
        #loading-screen .ld-fog {
            position: absolute; inset: -10%; pointer-events: none;
            background: radial-gradient(40% 18% at 20% 58%, rgba(250,245,230,.5), transparent 70%), radial-gradient(45% 20% at 78% 54%, rgba(250,245,230,.45), transparent 70%);
            animation: ld-fog 16s ease-in-out infinite alternate;
        }
        @keyframes ld-fog { from { transform: translateX(-4%); } to { transform: translateX(4%); } }
        #loading-screen .ld-ring {
            position: absolute; left: 17%; bottom: 13%; width: 120px; height: 34px; margin-left: -60px; border-radius: 50%; pointer-events: none;
            border: 3px solid rgba(243,234,213,.8); opacity: 0; animation: ld-ring 3s ease-out infinite;
        }
        #loading-screen .ld-ring.r2 { animation-delay: 1s; } #loading-screen .ld-ring.r3 { animation-delay: 2s; }
        @keyframes ld-ring { 0% { transform: scale(.4); opacity: .9; } 100% { transform: scale(4.2); opacity: 0; } }
        #loading-screen .ld-monster { position: absolute; left: 17%; bottom: 10%; width: min(150px, 24vw); transform: translateX(-50%); pointer-events: none; animation: ld-peek 3s ease-in-out infinite; }
        @keyframes ld-peek { 0%, 100% { transform: translate(-50%, 18%); } 50% { transform: translate(-50%, 2%); } }
        #loading-screen .ld-bubble { position: absolute; bottom: 8%; width: 12px; height: 12px; border-radius: 50%; border: 2px solid rgba(243,234,213,.85); pointer-events: none; animation: ld-bub 4s linear infinite; opacity: 0; }
        @keyframes ld-bub { 0% { transform: translateY(0) scale(.6); opacity: 0; } 15% { opacity: .9; } 100% { transform: translateY(-38vh) scale(1.2); opacity: 0; } }
        #loading-screen > :not(.ld-deco):not(.engine-mark) { position: relative; z-index: 1; }
        /* знак «не плескаться»: эмалевая табличка, качается на винте */
        #loading-screen .ld-sign {
            position: relative; display: grid; place-items: center; width: 62px; height: 62px; border: 2px solid #1f3a4f; border-radius: 5px; color: #1f3a4f; background: #f3ead5;
            box-shadow: inset 0 0 0 2px #f3ead5, inset 0 0 0 3.5px rgba(31,58,79,.7), 0 4px 0 #1f3a4f; transform-origin: 50% 6px; animation: ld-sway 3.4s ease-in-out infinite;
        }
        #loading-screen .ld-sign svg { width: 40px; height: 40px; overflow: visible; }
        @keyframes ld-sway { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
        /* название — мозаика: плиточная сетка внутри букв (текст берётся из #loading-title, его подставляет сборка) */
        #loading-title {
            margin: 4px 0 0; padding: 0 .04em; max-width: 92vw; text-align: center; text-transform: uppercase; letter-spacing: .02em;
            font: 800 clamp(30px, 11vw, 72px)/1.1 'BPM Bungee', 'BPM Unbounded Fit', Impact, system-ui, sans-serif; color: transparent;
            background: repeating-linear-gradient(0deg, transparent 0 .27em, rgba(243,234,213,.9) .27em .3em), repeating-linear-gradient(90deg, transparent 0 .27em, rgba(243,234,213,.9) .27em .3em), linear-gradient(90deg, #2b6f94 0 33%, #2a9d8f 33% 66%, #0f5e5a 66%);
            -webkit-background-clip: text; background-clip: text; filter: drop-shadow(0 .05em 0 #1f3a4f) drop-shadow(0 0 .025em #1f3a4f);
            animation: ld-title .8s cubic-bezier(.3, 1.3, .5, 1) both;
        }
        @keyframes ld-title { 0% { opacity: 0; transform: translateY(-18px) scale(.9); } 100% { opacity: 1; transform: none; } }
        /* дорожка: прогресс идёт вдоль красно-белой полосы поплавков */
        .loading-bar {
            width: min(360px, 80vw); height: 24px; position: relative; overflow: hidden; border: 2px solid #1f3a4f; border-radius: 3px;
            background-color: #faf5e6; box-shadow: 0 4px 0 #1f3a4f;
            background-image: repeating-linear-gradient(90deg, transparent 0 22px, rgba(31,58,79,.22) 22px 24px);
        }
        .loading-progress { height: 100%; width: 0%; transition: width .3s ease; position: relative; background: repeating-linear-gradient(90deg, #d64933 0 12px, #f3ead5 12px 24px); border-right: 2px solid #1f3a4f; }
        .loading-progress::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(135deg, rgba(31,58,79,.18) 0 4px, transparent 4px 8px); animation: ld-shine 1.2s linear infinite; }
        @keyframes ld-shine { from { background-position: 0 0; } to { background-position: 11.3px 0; } }
        #loading-percent { padding: .05em .7em; border: 2px solid #1f3a4f; border-radius: 3px; background: #f3ead5; font: 700 20px/1.2 'BPM Barlow', 'BPM Unbounded Fit', system-ui, sans-serif; letter-spacing: .12em; color: #1f3a4f; box-shadow: 0 3px 0 #1f3a4f; }
        .loading-text { font: 700 17px 'BPM Barlow', 'BPM Unbounded Fit', system-ui, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: #1f3a4f; text-align: center; min-height: 1em; }
        #loading-screen .ld-tip { max-width: min(460px, 86vw); min-height: 2.6em; padding: 8px 14px; border: 2px solid #1f3a4f; border-radius: 4px; background: rgba(250,245,230,.92);
            font: 700 clamp(14px, 3.4vw, 16px)/1.3 'BPM Barlow', 'BPM Unbounded Fit', system-ui, sans-serif; letter-spacing: .02em; color: #1f3a4f; text-align: center; box-shadow: 0 3px 0 #1f3a4f; }
        #loading-screen .ld-tip:empty { visibility: hidden; }
        #loading-screen .engine-mark { position: absolute; right: 12px; bottom: 10px; width: 54px; height: auto; opacity: .55; z-index: 1; }
        #loading-retry { min-height: 44px; padding: 10px 26px; border: 2px solid #1f3a4f; border-radius: 6px; background: #2a9d8f; color: #f3ead5; font: 700 20px 'BPM Barlow', 'BPM Unbounded Fit', system-ui, sans-serif; letter-spacing: .1em; text-transform: uppercase; cursor: pointer; box-shadow: 0 4px 0 #1f3a4f; }
        #loading-retry:active { transform: translateY(4px); box-shadow: 0 0 0 #1f3a4f; }
        @media (max-height: 420px) { #loading-screen { gap: 6px; } #loading-screen .ld-sign { width: 44px; height: 44px; } #loading-screen .ld-sign svg { width: 28px; height: 28px; } #loading-title { font-size: clamp(24px, 9vh, 44px); } #loading-screen .ld-monster { width: 90px; } #loading-screen .ld-tip { display: none; } }
        @media (prefers-reduced-motion: reduce) { #loading-screen * { animation: none !important; } }
    </style>
</head>
<body>

    <script>
        // Игровая область: долгий тап и ПКМ не открывают меню браузера, картинки не
        // тянутся, текст не выделяется — кроме настоящих полей ввода.
        (() => {
            const isField = t => t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable);
            for (const type of ['contextmenu', 'dragstart', 'selectstart']) {
                document.addEventListener(type, e => { if (!isField(e.target)) e.preventDefault(); });
            }
        })();
    </script>
