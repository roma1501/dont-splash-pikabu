<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Не плюхнись: слепой монстр</title>
    <link rel="icon" type="image/png" href="assets/branding/lory-engine.png">
    <link rel="stylesheet" href="css/game.css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #222;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        input, textarea, [contenteditable] { -webkit-user-select: text; user-select: text; }
        img { -webkit-user-drag: none; }
        #world3d {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
            touch-action: none;
        }
        /* Don’t Splash: экран загрузки — туманный бассейный зал, рябь, монстр в воде, вода-прогресс */
        #loading-screen {
            position: fixed; inset: 0; z-index: 1000; overflow: hidden;
            display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 12px;
            background: #d8d0b2; font-family: 'Unbounded', system-ui, sans-serif;
        }
        #loading-screen .ld-bg {
            position: absolute; inset: 0; pointer-events: none;
            background:
                radial-gradient(120% 70% at 50% 26%, rgba(255,250,236,.95) 0%, rgba(232,224,196,.55) 45%, rgba(214,206,176,0) 75%),
                linear-gradient(180deg, #e9e2c8 0%, #d9d1b2 52%, #9fcfbb 62%, #5fb59c 82%, #3f9a84 100%);
        }
        #loading-screen .ld-tiles {
            position: absolute; left: -20%; right: -20%; top: 0; height: 58%; pointer-events: none; opacity: .42;
            background-image: linear-gradient(rgba(150,135,100,.55) 2px, transparent 2px), linear-gradient(90deg, rgba(150,135,100,.55) 2px, transparent 2px);
            background-size: 46px 46px;
            -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 55%, transparent 100%); mask-image: linear-gradient(180deg, transparent 0%, #000 55%, transparent 100%);
        }
        #loading-screen .ld-water {
            position: absolute; left: -10%; right: -10%; bottom: 0; height: 40%; pointer-events: none;
            background-image: linear-gradient(rgba(255,255,255,.16) 2px, transparent 2px), linear-gradient(90deg, rgba(255,255,255,.16) 2px, transparent 2px);
            background-size: 60px 22px; transform: perspective(500px) rotateX(58deg); transform-origin: 50% 0;
            animation: ld-drift 9s linear infinite;
        }
        @keyframes ld-drift { from { background-position: 0 0; } to { background-position: 120px 44px; } }
        #loading-screen .ld-fog {
            position: absolute; inset: -10%; pointer-events: none;
            background: radial-gradient(40% 18% at 20% 62%, rgba(255,252,240,.55), transparent 70%), radial-gradient(45% 20% at 78% 58%, rgba(255,252,240,.5), transparent 70%), radial-gradient(60% 25% at 50% 70%, rgba(255,252,240,.35), transparent 70%);
            animation: ld-fog 14s ease-in-out infinite alternate;
        }
        @keyframes ld-fog { from { transform: translateX(-4%); } to { transform: translateX(4%); } }
        #loading-screen .ld-ring {
            position: absolute; left: 17%; bottom: 13%; width: 120px; height: 34px; margin-left: -60px; border-radius: 50%; pointer-events: none;
            border: 3px solid rgba(255,255,255,.75); opacity: 0; animation: ld-ring 3s ease-out infinite;
        }
        #loading-screen .ld-ring.r2 { animation-delay: 1s; } #loading-screen .ld-ring.r3 { animation-delay: 2s; }
        @keyframes ld-ring { 0% { transform: scale(.4); opacity: .9; } 100% { transform: scale(4.2); opacity: 0; } }
        #loading-screen .ld-monster { position: absolute; left: 17%; bottom: 10%; width: min(150px, 24vw); transform: translateX(-50%); pointer-events: none; animation: ld-peek 3s ease-in-out infinite; }
        @keyframes ld-peek { 0%, 100% { transform: translate(-50%, 18%); } 50% { transform: translate(-50%, 2%); } }
        #loading-screen .ld-bubble { position: absolute; bottom: 8%; width: 12px; height: 12px; border-radius: 50%; border: 2px solid rgba(255,255,255,.8); pointer-events: none; animation: ld-bub 4s linear infinite; opacity: 0; }
        @keyframes ld-bub { 0% { transform: translateY(0) scale(.6); opacity: 0; } 15% { opacity: .9; } 100% { transform: translateY(-38vh) scale(1.2); opacity: 0; } }
        #loading-screen > :not(.ld-deco):not(.engine-mark) { position: relative; z-index: 1; }
        #loading-screen .ld-logo { display: flex; flex-direction: column; align-items: center; line-height: .9; margin-bottom: 4px; text-align: center; }
        #loading-screen .ld-logo .l1 { font-size: clamp(22px, 5.4vw, 40px); font-weight: 800; color: #24425a; letter-spacing: .04em; }
        #loading-screen .ld-logo .l2 {
            font-size: clamp(44px, 12vw, 96px); font-weight: 900; color: #ffd84a; letter-spacing: .02em;
            -webkit-text-stroke: clamp(3px, .9vw, 6px) #24425a; paint-order: stroke fill; text-shadow: 0 6px 0 #24425a, 0 10px 24px rgba(36,66,90,.35);
        }
        #loading-screen .ld-wave { width: min(330px, 70vw); height: 14px; margin-top: 6px;
            background: radial-gradient(circle at 10px -4px, transparent 9px, #2bb3a3 10px, #2bb3a3 13px, transparent 14px) 0 0 / 20px 14px repeat-x; opacity: .9; }
        #loading-title { margin: 6px 0 0; font: 700 clamp(14px, 3.4vw, 20px)/1.2 'Unbounded', system-ui, sans-serif; color: #24425a; text-align: center; max-width: 86vw; }
        .loading-bar {
            width: min(340px, 78vw); height: 22px; border-radius: 12px; overflow: hidden; position: relative;
            background: #fffaf0; border: 3px solid #24425a; box-shadow: 0 4px 0 #24425a, inset 0 2px 0 rgba(0,0,0,.06);
            background-image: linear-gradient(90deg, rgba(36,66,90,.12) 2px, transparent 2px); background-size: 24px 100%;
        }
        .loading-progress {
            height: 100%; width: 0%; transition: width .3s ease; position: relative;
            background: linear-gradient(180deg, #8fe3cf 0%, #2bb3a3 55%, #1f9c8e 100%);
        }
        .loading-progress::after {
            content: ''; position: absolute; inset: 0;
            background: radial-gradient(circle at 8px 2px, rgba(255,255,255,.75) 3px, transparent 4px) 0 0 / 16px 22px repeat-x;
            animation: ld-shine 1.2s linear infinite;
        }
        @keyframes ld-shine { from { background-position: 0 0; } to { background-position: 16px 0; } }
        #loading-percent { font: 800 15px 'Unbounded', system-ui, sans-serif; color: #24425a; }
        .loading-text { font: 600 13px 'Unbounded', system-ui, sans-serif; color: #3a5a6e; text-align: center; min-height: 1em; }
        #loading-screen .ld-tip { max-width: min(460px, 86vw); min-height: 2.6em; padding: 8px 14px; border-radius: 12px; background: rgba(255,250,236,.78); border: 2px solid rgba(36,66,90,.25);
            font: 600 clamp(11px, 2.8vw, 13px)/1.35 'Unbounded', system-ui, sans-serif; color: #24425a; text-align: center; }
        #loading-screen .ld-tip:empty { visibility: hidden; }
        #loading-screen .engine-mark { position: absolute; right: 12px; bottom: 10px; width: 54px; height: auto; opacity: .55; z-index: 1; }
        #loading-retry { padding: 12px 24px; border: 3px solid #24425a; border-radius: 14px; background: #2bb3a3; color: #fff; font: 800 16px 'Unbounded', system-ui, sans-serif; cursor: pointer; box-shadow: 0 4px 0 #24425a; }
        @media (max-height: 420px) { #loading-screen { gap: 6px; } #loading-screen .ld-logo .l2 { font-size: clamp(34px, 10vh, 60px); } #loading-screen .ld-monster { width: 90px; } #loading-screen .ld-tip { display: none; } }
        @media (prefers-reduced-motion: reduce) { #loading-screen * { animation: none !important; } }
    </style>
</head>
<body>
    <canvas id="world3d"></canvas>
    <div id="loading-screen" role="status" aria-busy="true" aria-live="polite">
        <div class="ld-bg ld-deco"></div><div class="ld-tiles ld-deco"></div><div class="ld-water ld-deco"></div>
        <i class="ld-ring ld-deco"></i><i class="ld-ring r2 ld-deco"></i><i class="ld-ring r3 ld-deco"></i>
        <svg class="ld-monster ld-deco" viewBox="0 0 120 110" aria-hidden="true"><ellipse cx="60" cy="104" rx="56" ry="7" fill="#1f9c8e" opacity=".5"/><path d="M28 104 C24 70 30 34 60 22 C90 34 96 70 92 104 Z" fill="#20231f"/><path d="M14 104 C10 86 6 74 2 66 M106 104 C110 86 114 74 118 66" stroke="#20231f" stroke-width="7" stroke-linecap="round" fill="none"/><path d="M2 66 l-2 -8 M2 66 l-6 -4 M118 66 l2 -8 M118 66 l6 -4" stroke="#e9e1c4" stroke-width="3" stroke-linecap="round"/><circle cx="60" cy="56" r="22" fill="#6b3f45"/><circle cx="60" cy="56" r="16" fill="#3a0f17"/><g stroke="#f4ecd8" stroke-width="3" stroke-linecap="round"><path d="M60 41 v5 M60 71 v-5 M45 56 h5 M75 56 h-5 M49 45 l4 4 M71 67 l-4 -4 M71 45 l-4 4 M49 67 l4 -4"/></g><circle cx="60" cy="56" r="6" fill="#c2253a"/></svg>
        <i class="ld-bubble ld-deco" style="left:22%;animation-delay:.3s"></i><i class="ld-bubble ld-deco" style="left:37%;animation-delay:1.9s"></i><i class="ld-bubble ld-deco" style="left:64%;animation-delay:.9s"></i><i class="ld-bubble ld-deco" style="left:80%;animation-delay:2.6s"></i>
        <div class="ld-fog ld-deco"></div>
        <img class="engine-mark" src="assets/branding/lory-engine.png" alt="" aria-hidden="true">
        <div class="ld-logo" aria-hidden="true"><span class="l1">DON’T</span><span class="l2">SPLASH</span><span class="ld-wave"></span></div>
        <h1 id="loading-title" data-t="title">Не плюхнись: слепой монстр</h1>
        <div class="loading-bar" id="loading-meter" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="loading-progress"></div></div>
        <div id="loading-percent">0%</div>
        <div class="loading-text" data-t="loading">Загрузка…</div>
        <div class="ld-tip" id="ld-tip"></div>
        <button id="loading-retry" type="button" hidden></button>
    </div>

    <script>
        // Игровая область: долгий тап и ПКМ не открывают меню браузера, картинки не
        // тянутся, текст не выделяется — кроме настоящих полей ввода.
        (() => {
            const isField = t => t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable);
            for (const type of ['contextmenu', 'dragstart', 'selectstart']) {
                document.addEventListener(type, e => { if (!isField(e.target)) e.preventDefault(); });
            }
        })();
    </script>
